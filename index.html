function figure(look,x=46){return {kind:'character',look:structuredClone(look),x,y:85,line:0}}

let waiting=null;
function characterPicture(item){
 const look=item.pose==='sleep'?{...item.look,Eyes:4}:item.look;
 const picture=group(art(look).whole);
 let body=picture;
 if(item.pose==='sleep')body='\x3cg transform="translate(100 220) rotate(-73) scale(.73) translate(-100 -145)">'+picture+'\x3c/g>';
 if(item.pose==='sit')body='\x3csvg x="0" y="25" width="200" height="212" viewBox="0 0 200 212">'+picture+'\x3c/svg>\x3csvg x="0" y="237" width="200" height="38" preserveAspectRatio="none" viewBox="0 212 200 68">'+group(art(look).whole)+'\x3c/svg>';
 const held=item.held;

 const size=held?Math.max(32,Math.min(83,propScale[held.type][held.active?1:0]*260)):0;
 return '\x3csvg aria-hidden="true" viewBox="0 0 200 280">'+body+(held?'\x3cg transform="translate('+(item.pose==='sleep'?94:134-size/2)+' '+(item.pose==='sit'?192:item.pose==='sleep'?205:170)+')">\x3csvg width="'+size+'" height="'+size+'">'+accessory+'\x3c/svg>\x3c/g>':'')+'\x3c/svg>';
}
function clearPose(person){delete person.pose;delete person.support}
function release(person){
 if(!person.held)return;
 const obj=person.held;delete person.held;obj.x=Math.max(12,person.x-11);obj.y=Math.min(95,person.y+1);roomItems().push(obj);
}
function attach(actor,target){
 const items=roomItems();
 if(actor?.kind==='prop'&&handheld.has(actor.type)&&target?.kind==='character'){
  release(target);items.splice(items.indexOf(actor),1);target.held=actor;chosen=items.indexOf(target);
 }else if(actor?.kind==='character'&&target&&(seats.has(target.type)||target.type==='bed')){
  for(const person of items)if(target.uid&&person.support===target.uid)clearPose(person);
  target.uid||=globalThis.crypto?.randomUUID?.()||("seat-"+Date.now()+"-"+Math.random());actor.pose=target.type==='bed'?'sleep':'sit';actor.support=target.uid;
  actor.x=target.x;actor.y=Math.max(50,Math.min(98,target.y-(actor.pose==='sleep'?4:12)));
  items.splice(items.indexOf(actor),1);items.splice(items.indexOf(target)+1,0,actor);chosen=items.indexOf(actor);
 }else return false;
 waiting=null;drawRoom();keepWorld();return true;
}
function playControls(){
 const item=selected(),panel=$('#roleplay');panel.replaceChildren();
 if(!item)return;
 if(item.kind==='character'){
  if(item.held){
   btn(panel,'Set down '+itemName(item.held),()=>{release(item);drawRoom();keepWorld()});
   if(!furniture[item.held.type])btn(panel,toys[item.held.type][item.held.active?4:3],()=>{item.held.active=!item.held.active;drawRoom();keepWorld()});
  }
  if(item.pose)btn(panel,item.pose==='sleep'?'Wake up':'Stand up',()=>{clearPose(item);drawRoom();keepWorld()});
 }
 if((item.kind==='prop'&&handheld.has(item.type))||(item.kind==='character'&&roomItems().some(i=>seats.has(i.type)||i.type==='bed'))){
  btn(panel,waiting?'Cancel':item.kind==='character'?'Sit or tuck in…':'Give to character…',()=>{
   waiting=waiting?null:item;playControls();
   if(waiting)for(const [i,target] of roomItems().entries()){
    const valid=item.kind==='character'?seats.has(target.type)||target.type==='bed':target.kind==='character';
    if(valid)btn(panel,itemName(target)+' '+(i+1),()=>attach(item,target));
   }
  });
 }
}
function followSupport(item,dx,dy){
 if(!item.uid)return;
 for(const p of roomItems())if(p.support===item.uid){p.x=Math.max(10,Math.min(90,p.x+dx));p.y=Math.max(45,Math.min(98,p.y+dy));position($('#pieces').children[roomItems().indexOf(p)],p)}
}

function enterRoom(id,traveler=null){
 waiting=null;$('#houseMap').hidden=true;
 world.room=id;chosen=null;gesture=null;
 if(!Array.isArray(world.rooms[id])){
  const start=starters[places.indexOf(id)]||[];
  world.rooms[id]=[...(traveler?[]:[figure(state)]),...start.map((type,i)=>prop(type,i?77:24,i?73:83))];
 }
 if(traveler){roomItems().push(traveler);chosen=roomItems().length-1}
 $('#worldScene').innerHTML=roomBackdrop(id);
 $('#roomName').textContent=roomTitle(id);
 $('#places').value=String(id);drawRoom();keepWorld();
}
function selected(){return chosen===null?null:roomItems()[chosen]}
const roomPalette=['#ee71ac','#8c68df','#519fe5','#41bca3','#edbd48','#ed8662','#ededef','#70618b'];
function itemPicture(item){
 const svg=furniture[item.type]?furnitureImage(item.type,item.active):toyImage(item.type,item.active);
 if(!roomPalette.includes(item.tint))return svg;
 // Replace painted color stops, keeping highlights, outlines and transparent regions.
 return svg.replace(/stop-color="(#[a-f\d]{6}|rgb\([^)]+\))"/gi,(all,color)=>{
  const values=color[0]==='#'?color.slice(1).match(/../g).map(x=>parseInt(x,16)):color.match(/[\d.]+/g).map(Number);
  const lightness=(Math.max(...values)+Math.min(...values))/510;
  const base=item.tint.slice(1);
  return 'stop-color="'+shadeColor(base,lightness>.55?[255,255,246]:[45,35,66],lightness>.55?(lightness-.55)*1.5:(.55-lightness)*1.1)+'"';
 });
}
function wallpaper(id,original){
 const style=world.decor?.[id];
 if(!style||!houseRooms[id])return original;
 const color=roomPalette.includes(style.color)?style.color:roomPalette[0];
 let pattern='';
 if(style.pattern==='Stripes')pattern=repeat(20,i=>block(i*25,0,9,238,'#ffffff55',0));
 if(style.pattern==='Dots')pattern=repeat(120,i=>oval(12+i%20*24,12+Math.floor(i/20)*40,3,3,'#fff4df'));
 if(style.pattern==='Stars')pattern=repeat(60,i=>star(15+i%12*40,20+Math.floor(i/12)*47,.5,'#fff4cf'));
 if(style.pattern==='Flowers')pattern=repeat(48,i=>bloom(22+i%12*40,24+Math.floor(i/12)*58,6,'#ffefd9'));
 const wall=paint(block(0,0,480,238,color,0)+pattern,'room');
 // Preserve the floor and window while replacing just the wall surface.
 return wall+original.replace(/<rect[^>]*width="480"[^>]*height="400"[^>]*\/>/g,'').replace(/<rect[^>]*width="3"[^>]*height="245"[^>]*\/>/g,'');
}

function itemName(item){return item.kind==='character'?'Character':toys[item.type][0]}
function controls(){

 playControls();
 const item=selected(),action=$('#worldAction');
 action.disabled=$('#worldRemove').disabled=!item;
 $('#toBack').disabled=$('#backward').disabled=!item||chosen===0;
 $('#toFront').disabled=$('#forward').disabled=!item||chosen===roomItems().length-1;
 action.textContent=!item?'Play':item.kind==='character'?'Change speech':toys[item.type][item.active?4:3];

}
function position(el,item){el.style.left=item.x+'%';el.style.top=item.y+'%'}
function drawRoom(){
 const tray=$('#pieces');tray.replaceChildren();
 roomItems().forEach((item,i)=>{
  const el=document.createElement('button');el.type='button';el.className='piece '+item.kind;
  el.style.zIndex=String(i+1);el.dataset.index=i;el.setAttribute('aria-label',itemName(item)+' '+(i+1));el.setAttribute('aria-pressed',i===chosen);
  if(item.kind==='character'){
   el.innerHTML=characterPicture(item);
   if(lines[item.line]){const bubble=document.createElement('span');bubble.className='bubble';bubble.textContent=lines[item.line];el.append(bubble)}
  }else{
   el.style.height=(57*propScale[item.type][item.active?1:0])+'%';
   if(furniture[item.type]){el.style.aspectRatio=String(furnitureRatio(item.type));el.innerHTML=itemPicture(item)}
   else el.innerHTML=itemPicture(item);
  }
  position(el,item);tray.append(el);
 });
 controls();
}
function choose(i){
 waiting=null;chosen=i;for(const el of $('#pieces').children)el.setAttribute('aria-pressed',Number(el.dataset.index)===chosen);
 controls();
}
function moveItem(item,x,y){
 const oldX=item.x,oldY=item.y;
 const isPerson=item.kind==='character';
 const height=isPerson?57:57*propScale[item.type][item.active?1:0];
 const bounds=playfield.getBoundingClientRect();
 const halfWidth=height*(isPerson?200/280:furniture[item.type]?furnitureRatio(item.type):1)*bounds.height/(2*bounds.width);
 item.x=Math.max(halfWidth,Math.min(100-halfWidth,x));
 item.y=Math.max(height,Math.min(98,y));followSupport(item,item.x-oldX,item.y-oldY);
}
const playfield=$('#playfield');
playfield.onpointerdown=e=>{
 if(e.button!==0||gesture)return;
 const el=e.target.closest('.piece');
 if(!el){choose(null);return}
 if(waiting&&attach(waiting,roomItems()[Number(el.dataset.index)])){e.preventDefault();return}
 choose(Number(el.dataset.index));el.focus({preventScroll:true});
 const item=selected();gesture={id:e.pointerId,x:e.clientX,y:e.clientY,startX:item.x,startY:item.y};
 playfield.setPointerCapture(e.pointerId);e.preventDefault();
};
playfield.onpointermove=e=>{
 if(!gesture||e.pointerId!==gesture.id)return;
 const rect=playfield.getBoundingClientRect(),item=selected();
 if(!gesture.moved&&Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)<4)return;
 gesture.moved=true;if(item.pose){clearPose(item);drawRoom()}
 moveItem(item,gesture.startX+(e.clientX-gesture.x)*100/rect.width,gesture.startY+(e.clientY-gesture.y)*100/rect.height);
 position($('#pieces').children[chosen],item);
};
playfield.onpointerup=e=>{
 if(!gesture||gesture.id!==e.pointerId||!gesture.moved)return;
 const actor=selected();gesture=null;
 for(const node of document.elementsFromPoint(e.clientX,e.clientY)){
  const piece=node.closest('.piece');if(!piece)continue;
  const target=roomItems()[Number(piece.dataset.index)];if(target!==actor&&attach(actor,target))return;
 }
 keepWorld();
};
playfield.onlostpointercapture=()=>{if(gesture){gesture=null;keepWorld()}};
playfield.onclick=e=>{const el=e.target.closest('.piece');if(el)choose(Number(el.dataset.index))};
playfield.onkeydown=e=>{
 const el=e.target.closest('.piece'),delta={ArrowLeft:[-2,0],ArrowRight:[2,0],ArrowUp:[0,-2],ArrowDown:[0,2]}[e.key];
 if(!el||!delta)return;
 e.preventDefault();choose(Number(el.dataset.index));const item=selected();
 if(item.pose){clearPose(item);drawRoom()}
 moveItem(item,item.x+delta[0],item.y+delta[1]);position(el,item);keepWorld();
};
function moveLayer(target){
 if(chosen===null||target===chosen)return;
 const pieces=roomItems();
 if(target<0||target>=pieces.length)return;
 const [item]=pieces.splice(chosen,1);pieces.splice(target,0,item);
 chosen=target;drawRoom();keepWorld();
}
$('#toBack').onclick=()=>moveLayer(0);
$('#backward').onclick=()=>moveLayer(chosen-1);
$('#forward').onclick=()=>moveLayer(chosen+1);
$('#toFront').onclick=()=>moveLayer(roomItems().length-1);
function addItem(item){
 roomItems().push(item);chosen=roomItems().length-1;drawRoom();keepWorld();
}
$('#worldAction').onclick=()=>{
 const item=selected();if(!item)return;
 if(item.kind==='character')item.line=(item.line+1)%lines.length;else item.active=!item.active;
 moveItem(item,item.x,item.y);drawRoom();keepWorld();
};
$('#worldRemove').onclick=()=>{
 const obj=selected();if(!obj)return;release(obj);if(obj.uid)for(const p of roomItems())if(p.support===obj.uid)clearPose(p);roomItems().splice(chosen,1);chosen=null;drawRoom();keepWorld();
};
function fillCast(){
 const cast=$('#cast');cast.replaceChildren();
 [state,...looks].forEach((s,i)=>{
  const b=btn(cast,i?'Look '+i:'My avatar',()=>addItem(figure(s,28+Math.random()*44)));
  b.insertAdjacentHTML('afterbegin','\x3csvg aria-hidden="true" viewBox="0 0 200 280">'+group(art(s).whole)+'\x3c/svg>');
 });
}
function setMode(play){
 $('#houseMap').hidden=true;$('#studio').hidden=play;$('#world').hidden=!play;
 $('#studioMode').setAttribute('aria-pressed',!play);$('#worldMode').setAttribute('aria-pressed',play);
 if(play){fillCast();enterRoom(world.room)}
}
$('#worldMode').onclick=()=>setMode(true);$('#studioMode').onclick=()=>setMode(false);
for(const id of places){const option=document.createElement('option');option.value=id;option.textContent=roomTitle(id);$('#places').append(option)}
$('#places').onchange=e=>enterRoom(Number(e.target.value));
showCatalog();
function selectPack(){
 packFilter=$('#packSelect').value==='christmas';
 render();showCatalog();
}
$('#packSelect').onchange=selectPack;
$('#packSelect').value='all';
setMode(false);

function worldTools(name){
 for(const panel of document.querySelectorAll('[data-world-section]'))panel.hidden=panel.dataset.worldSection!==name;
 for(const button of document.querySelectorAll('[data-world-tab]'))button.setAttribute('aria-pressed',button.dataset.worldTab===name);
}
for(const button of document.querySelectorAll('[data-world-tab]'))button.onclick=()=>worldTools(button.dataset.worldTab);
worldTools('play');
</script><script>if ("serviceWorker" in navigator && location.protocol === "https:") { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.warn)); }</script></body></html>
